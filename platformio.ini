; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5dial, cyddial

[common]
build_flags = 
    !python3 ./git-version.py
    -DJSP_USE_CHARP
    -DE4_POS_T
    -DVERBATIM_GCODE_MODES
lib_deps =
    https://github.com/MitchBradley/json-streaming-parser#charp-1.0.2
    https://github.com/MitchBradley/GrblParser#9108f54
build_src_filter = +<*.c> +<*.h> +<*.cpp> +<*.hpp>  -<System*.cpp> -<Hardware*.cpp> +<System.cpp> -<Touch_Class.cpp> -<CNC_Pendant_UI.cpp>

[env:m5dial]
; Pendant based on M5Dial
; http://wiki.fluidnc.com/en/hardware/official/M5Dial_Pendant
platform = espressif32
board = m5stack-stamps3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
monitor_filters=esp32_exception_decoder
board_build.filesystem = littlefs
upload_flags=--no-stub
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified
    m5stack/M5Dial
build_flags =
    ${common.build_flags}
    -DUSE_M5
    -DFNC_BAUD=1000000
    -DDEBUG_TO_USB
custom_filesystem_start=0x670000
extra_scripts = ./build_merged.py
build_src_filter = ${common.build_src_filter} +<SystemArduino.cpp> +<HardwareM5Dial.cpp>

[env:cyd_base]
; Pendant based on a 2432S028 "Cheap Yellow Display" and a hand wheel pulse encoder
; http://wiki.fluidnc.com/en/hardware/official/CYD_Dial_Pendant
platform = espressif32
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@^3.20016.0
monitor_filters=esp32_exception_decoder
monitor_speed=115200
upload_speed=460800
board_build.filesystem = littlefs
upload_flags=--no-stub
lib_deps =
    ${common.lib_deps}
    ; m5stack/M5Unified
    LovyanGFX=https://github.com/lovyan03/LovyanGFX#develop
build_flags =
    ${common.build_flags}
    -DUSE_LOVYANGFX
    -DFNC_BAUD=1000000
    ;-DCORE_DEBUG_LEVEL=5
    -DCYD_BUTTONS
custom_filesystem_start=0x290000
extra_scripts = ./build_merged.py
build_src_filter = ${common.build_src_filter} +<SystemArduino.cpp> +<Hardware2432.cpp> +<Touch_Class.cpp> -<cyd/*>

# This works for both resistive and capacitive CYDs, chosen at initial startup
[env:cyddial]
extends = env:cyd_base
build_flags =
    ${env:cyd_nodebug.build_flags}
    -DCYD_BUTTONS
    -DRESISTIVE_CYD
    -DCAPACITIVE_CYD

# This is the original CYD build for a resistive CYD
[env:cyd_resistive]
extends = env:cyd_base
build_flags =
    ${env:cyd_base.build_flags}
    -DDEBUG_TO_USB
    -DRESISTIVE_CYD

# This is for a capacitive CYD without buttons or lockout
[env:cyd_nodebug]
extends = env:cyd_base
build_flags =
    ${env:cyd_base.build_flags}
    -DCAPACITIVE_CYD

# This is for a capacitive CYD with physical buttons
[env:cyd_buttons]
extends = env:cyd_nodebug
build_flags =
    ${env:cyd_nodebug.build_flags}
    -DCYD_BUTTONS

# This is for a capacitive CYD with new UI (dual-core, per-screen files)
[env:cyd_new_ui]
extends = env:cyd_nodebug
; Single-app no-OTA partition layout.  The default Arduino-ESP32 layout
; reserves 1.25 MB twice for OTA slots, but the pendant doesn't OTA —
; updates flow via USB + the web installer.  Dropping OTA gives us a
; single 2.5 MB app partition while keeping LittleFS at 0x290000 so
; existing pendants doing an "Update" install keep their loadouts.
board_build.partitions = partitions_cyd_noota.csv
build_flags =
    ${env:cyd_nodebug.build_flags}
    -DCYD_BUTTONS
    -DUSE_NEW_UI
    -DCYD_BATTERY_ADC
    ; v2.2.0: the WiFi/WebSocket backend was removed (unreliable in practice on
    ; the CYD's small antenna).  Transports are now UART and ESP-NOW.  ESP-NOW
    ; still needs the esp_wifi radio driver, but none of the Arduino WiFi/TCP/
    ; TLS/WebSocket layers — see ESPNOW_SPEC.md §7.
    -DUSE_ESPNOW
lib_deps =
    ${env:cyd_base.lib_deps}
build_src_filter = ${env:cyd_base.build_src_filter} +<CNC_Pendant_UI.cpp> +<screens/*>
extra_scripts =
    ./build_merged.py
    post:scripts/copy_merged_bin.py

# Combined firmware — supports both resistive (XPT2046) and capacitive (CST816S) CYD screens.
# On first boot the pendant auto-detects which screen type is fitted and saves the result to
# flash; subsequent boots go straight to the correct driver. This is the binary shipped via
# the web installer and Releases page.
[env:cyd_new_ui_combined]
extends = env:cyd_new_ui
build_flags =
    ${env:cyd_new_ui.build_flags}
    -DRESISTIVE_CYD

# Same as cyd_new_ui_combined, but with dbg_printf() output on the USB serial
# port.  DIAGNOSTIC BUILD — do not ship it.
#
# dbg_print() is compiled out entirely without DEBUG_TO_USB, which is why the
# serial monitor shows nothing on a normal build.  Enabling it also MOVES the
# FluidNC UART link from UART0 (GPIO 1/3, shared with USB) to UART1 (GPIO 35/21)
# so the console is usable — see Hardware2432.hpp.  Consequences:
#   • ESP-NOW testing is unaffected: the UART backend is not in use.
#   • Wired (UART) mode needs the controller rewired to GPIO 35/21 to work here.
#   • GPIO 21 is the RESISTIVE board's backlight pin, so backlight control is
#     lost on that variant while running this build (capacitive uses GPIO 27).
[env:cyd_new_ui_combined_debug]
extends = env:cyd_new_ui_combined
build_flags =
    ${env:cyd_new_ui_combined.build_flags}
    -DDEBUG_TO_USB

[env:windows]
; Runs the code under Windows, useful for development
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified@^0.1.10
platform = native
build_type = release
build_flags = -O0 -xc++ -std=c++17 -lSDL2
  ${common.build_flags}
  -DWINDOWS
  -DUSE_M5
  -DM5GFX_BOARD=board_M5Dial
  -I"C:/msys64/mingw32/include/SDL2"         ; for Windows SDL2
  -L"C:/msys64/mingw32/lib"                  ; for Windows SDL2
build_src_filter = ${common.build_src_filter} +<SystemWindows.cpp> -<Encoder.cpp>
